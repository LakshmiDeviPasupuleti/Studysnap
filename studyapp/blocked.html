<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Session Ended</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #f7f8fa;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 28px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 560px;
    }
    h1 { margin: 0 0 8px; }
    a {
      display:inline-block;
      margin-top: 16px;
      background:#2ecc71;
      color:white;
      padding:10px 16px;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
    }
    a:hover{background:#27ae60;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Session Ended</h1>
    <p>You reached the maximum number of focus warnings. Take a break and come back ready to focus.</p>
    <a href="/dashboard">Start New Session</a>
  </div>
</body>
</html>
